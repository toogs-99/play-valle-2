services:
  postgres:
    image: postgres:16-alpine
    container_name: licitflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: licitflow
      POSTGRES_PASSWORD: licitflow
      POSTGRES_DB: licitflow
    # Hardening: Postgres internal only
    expose:
      - "5432"
    volumes:
      - licitflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licitflow -d licitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: licitflow_redis
    restart: unless-stopped
    # BSI/CERT-Bund: Redis internal only
    expose:
      - "6379"
    volumes:
      - licitflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: licitflow_app
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "8142:8142"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: licitflow_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - licitflow_caddy_data:/data
      - licitflow_caddy_config:/config
    depends_on:
      - app

volumes:
  licitflow_postgres_data:
  licitflow_redis_data:
  licitflow_caddy_data:
  licitflow_caddy_config:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
