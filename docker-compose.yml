services:
  postgres:
    image: postgres:16-alpine
    container_name: licitflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: licitflow
      POSTGRES_PASSWORD: licitflow
      POSTGRES_DB: licitflow
    ports:
      - "5432:5432"
    volumes:
      - licitflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: licitflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - licitflow_redis_data:/data

volumes:
  licitflow_postgres_data:
  licitflow_redis_data:
